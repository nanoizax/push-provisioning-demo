# Project-wide Gradle settings.

# Use the AndroidX artifacts (required by Compose, Retrofit's callers, etc.).
android.useAndroidX=true

# Kotlin code style for the Kotlin Gradle plugin.
kotlin.code.style=official

# Give the Gradle daemon enough heap for AGP 8.x + Compose builds.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Only keep the resources for the ABIs/densities you use (non-transitive R classes
# also speed up incremental builds).
android.nonTransitiveRClass=true
