name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend crypto & API smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run end-to-end smoke test (no dependencies)
        run: npm run smoke
      - name: Type-check
        run: npm install && npm run typecheck
