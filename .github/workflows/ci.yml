name: CI

on:
  push:
    branches: [main]
  pull_request:

# NOTE: the iOS module (PassKit) requires Xcode + the iOS SDK and is validated locally;
# it is not built in CI. The backend and the Android library are covered below.

jobs:
  backend:
    name: Backend crypto & API smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run end-to-end smoke test (no dependencies)
        run: npm run smoke
      - name: Type-check
        run: npm install && npm run typecheck

  android:
    name: Android library build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Assemble the push-provisioning library
        working-directory: android
        run: ./gradlew :pushprovisioning:assembleDebug --no-daemon --stacktrace
